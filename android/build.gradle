buildscript {
    ext.kotlin_version = '1.9.24'
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.4.0'  // Update to 8.4.0
        classpath 'com.google.gms:google-services:4.3.15'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

// Apply our custom fix scripts
apply from: "${project.rootDir}/jlink_fix.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
    
    // Disable all connectivity_plus tasks across all subprojects
    afterEvaluate { project ->
        if (project.name == 'connectivity_plus') {
            println "Found connectivity_plus project, disabling all tasks"
            project.tasks.configureEach { task ->
                task.enabled = false
                println "Disabled task: ${task.name}"
            }
        }
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}